server:
  port: 8081

spring:
  application:
    name: category-service
  datasource:
    # URL para base de datos en memoria
    url: jdbc:h2:mem:categorydb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console # Podr�s ver tu BD entrando a localhost:8081/h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
